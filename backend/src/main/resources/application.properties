spring.application.name=finxguard-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/frauddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:frauduser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fraudpass}
spring.datasource.driver-class-name=org.postgresql.Driver
finxguard.admin-registration-key=${FINXGUARD_ADMIN_REGISTRATION_KEY:FinXGuardAdmin2026}
# Supabase Auth
finxguard.supabase.url=${SUPABASE_URL}
finxguard.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
# CORS Allowed Origins
finxguard.cors.allowed-origins=${FINXGUARD_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}