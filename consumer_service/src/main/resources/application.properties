spring.application.name=consumer-service

server.port=8082

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

spring.kafka.consumer.group-id=finxguard-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/frauddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:frauduser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fraudpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Rule Engine URL
rule.engine.url=${RULE_ENGINE_URL:http://localhost:8083}